<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST CIRCLE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #18251d;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #18251d;
    color: white;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    z-index: 10;
}
</style>
</head>

<body>

<div id="loading">LAST CIRCLE</div>
<canvas id="gameCanvas"></canvas>

<script>
"use strict";

// ============================================================
// CANVAS
// ============================================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let screenWidth = window.innerWidth;
let screenHeight = window.innerHeight;
let deviceScale = Math.min(window.devicePixelRatio || 1, 2);

function resizeCanvas() {
    screenWidth = window.innerWidth;
    screenHeight = window.innerHeight;
    deviceScale = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(screenWidth * deviceScale);
    canvas.height = Math.floor(screenHeight * deviceScale);

    canvas.style.width = screenWidth + "px";
    canvas.style.height = screenHeight + "px";

    ctx.setTransform(
        deviceScale,
        0,
        0,
        deviceScale,
        0,
        0
    );
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// ============================================================
// WORLD
// ============================================================

const WORLD = {
    width: 5000,
    height: 5000
};


// ============================================================
// INPUT
// ============================================================

const keys = new Set();

window.addEventListener("keydown", (event) => {
    keys.add(event.key.toLowerCase());

    if (
        [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(event.key.toLowerCase())
    ) {
        event.preventDefault();
    }
});

window.addEventListener("keyup", (event) => {
    keys.delete(event.key.toLowerCase());
});

window.addEventListener("blur", () => {
    keys.clear();
});


// ============================================================
// MOUSE
// ============================================================

const mouse = {
    x: screenWidth / 2,
    y: screenHeight / 2,
    worldX: 0,
    worldY: 0
};

canvas.addEventListener("mousemove", (event) => {
    const rect = canvas.getBoundingClientRect();

    mouse.x = event.clientX - rect.left;
    mouse.y = event.clientY - rect.top;
});


// ============================================================
// CAMERA
// ============================================================

const camera = {
    x: 0,
    y: 0
};


// ============================================================
// PLAYER
// ============================================================

const player = {
    x: WORLD.width / 2,
    y: WORLD.height / 2,

    radius: 18,

    speed: 260,

    angle: 0,

    health: 100,
    maxHealth: 100
};


// ============================================================
// LOCATIONS
// ============================================================

const locations = [
    {
        name: "Riverside Town",
        x: 900,
        y: 950,
        width: 1000,
        height: 850
    },

    {
        name: "Ironworks",
        x: 3150,
        y: 850,
        width: 1000,
        height: 850
    },

    {
        name: "Pinewood",
        x: 700,
        y: 2850,
        width: 1200,
        height: 1100
    },

    {
        name: "Sunset Coast",
        x: 3150,
        y: 3100,
        width: 1200,
        height: 900
    },

    {
        name: "Greenfield Farms",
        x: 2150,
        y: 2050,
        width: 900,
        height: 800
    },

    {
        name: "Echo Base",
        x: 3350,
        y: 2100,
        width: 900,
        height: 700
    }
];


// ============================================================
// ROADS
// ============================================================

const roads = [
    {
        x1: 450,
        y1: 2400,
        x2: 4550,
        y2: 2400,
        width: 100
    },

    {
        x1: 2400,
        y1: 450,
        x2: 2400,
        y2: 4550,
        width: 100
    },

    {
        x1: 1100,
        y1: 1000,
        x2: 2400,
        y2: 2400,
        width: 70
    },

    {
        x1: 2400,
        y1: 2400,
        x2: 3700,
        y2: 3300,
        width: 70
    }
];


// ============================================================
// MAP OBJECTS
// ============================================================

const trees = [];
const rocks = [];
const buildings = [];
const waterAreas = [];


// ============================================================
// SEEDED RANDOM
// ============================================================

function seededRandom(seed) {
    let value = seed;

    return function () {
        value = (value * 1664525 + 1013904223) % 4294967296;
        return value / 4294967296;
    };
}

const random = seededRandom(823741);


// ============================================================
// BUILDING HELPERS
// ============================================================

function addBuilding(
    x,
    y,
    width,
    height,
    type = "house"
) {
    buildings.push({
        x,
        y,
        width,
        height,
        type
    });
}

function addWater(
    x,
    y,
    width,
    height
) {
    waterAreas.push({
        x,
        y,
        width,
        height
    });
}


// ============================================================
// LOCATION BUILDINGS
// ============================================================

// Riverside Town
addBuilding(1050, 1050, 180, 130, "house");
addBuilding(1300, 980, 220, 150, "shop");
addBuilding(1580, 1150, 160, 120, "house");
addBuilding(1100, 1400, 200, 140, "house");
addBuilding(1450, 1450, 240, 160, "house");

// Ironworks
addBuilding(3300, 1000, 350, 220, "warehouse");
addBuilding(3750, 950, 300, 190, "warehouse");
addBuilding(3450, 1350, 250, 170, "industrial");
addBuilding(3900, 1350, 300, 200, "industrial");

// Pinewood
addBuilding(950, 3050, 150, 110, "cabin");
addBuilding(1250, 3250, 170, 120, "cabin");
addBuilding(1500, 3000, 150, 110, "cabin");
addBuilding(1100, 3550, 180, 120, "cabin");

// Sunset Coast
addBuilding(3350, 3250, 210, 140, "house");
addBuilding(3650, 3400, 250, 160, "shop");
addBuilding(4000, 3250, 180, 130, "house");

// Greenfield Farms
addBuilding(2250, 2150, 260, 180, "farmhouse");
addBuilding(2450, 2500, 300, 200, "barn");

// Echo Base
addBuilding(3450, 2200, 350, 220, "research");
addBuilding(3900, 2250, 280, 190, "research");
addBuilding(3650, 2550, 400, 170, "research");


// ============================================================
// RIVER
// ============================================================

addWater(
    0,
    1850,
    WORLD.width,
    230
);


// ============================================================
// TREES + ROCKS
// ============================================================

for (let i = 0; i < 650; i++) {
    trees.push({
        x: random() * WORLD.width,
        y: random() * WORLD.height,
        radius: 12 + random() * 12
    });
}

for (let i = 0; i < 180; i++) {
    rocks.push({
        x: random() * WORLD.width,
        y: random() * WORLD.height,
        radius: 7 + random() * 9
    });
}


// ============================================================
// COORDINATE CONVERSION
// ============================================================

function worldToScreen(x, y) {
    return {
        x: x - camera.x,
        y: y - camera.y
    };
}

function screenToWorld(x, y) {
    return {
        x: x + camera.x,
        y: y + camera.y
    };
}


// ============================================================
// RECTANGLE / CIRCLE COLLISION
// ============================================================

function circleIntersectsBuilding(
    x,
    y,
    radius,
    building
) {
    const closestX = Math.max(
        building.x,
        Math.min(x, building.x + building.width)
    );

    const closestY = Math.max(
        building.y,
        Math.min(y, building.y + building.height)
    );

    const dx = x - closestX;
    const dy = y - closestY;

    return (
        dx * dx + dy * dy <
        radius * radius
    );
}

function positionBlocked(x, y) {
    for (const building of buildings) {
        if (
            circleIntersectsBuilding(
                x,
                y,
                player.radius,
                building
            )
        ) {
            return true;
        }
    }

    return false;
}


// ============================================================
// PLAYER UPDATE
// ============================================================

function updatePlayer(deltaTime) {

    let moveX = 0;
    let moveY = 0;

    if (
        keys.has("w") ||
        keys.has("arrowup")
    ) {
        moveY -= 1;
    }

    if (
        keys.has("s") ||
        keys.has("arrowdown")
    ) {
        moveY += 1;
    }

    if (
        keys.has("a") ||
        keys.has("arrowleft")
    ) {
        moveX -= 1;
    }

    if (
        keys.has("d") ||
        keys.has("arrowright")
    ) {
        moveX += 1;
    }

    // Normalize diagonal movement
    const length = Math.hypot(
        moveX,
        moveY
    );

    if (length > 0) {
        moveX /= length;
        moveY /= length;
    }

    const nextX =
        player.x +
        moveX *
        player.speed *
        deltaTime;

    const nextY =
        player.y +
        moveY *
        player.speed *
        deltaTime;

    // X collision
    if (
        !positionBlocked(
            nextX,
            player.y
        )
    ) {
        player.x = nextX;
    }

    // Y collision
    if (
        !positionBlocked(
            player.x,
            nextY
        )
    ) {
        player.y = nextY;
    }

    // Keep player inside world
    player.x = Math.max(
        player.radius,
        Math.min(
            WORLD.width - player.radius,
            player.x
        )
    );

    player.y = Math.max(
        player.radius,
        Math.min(
            WORLD.height - player.radius,
            player.y
        )
    );

    // Mouse aim
    const playerScreen =
        worldToScreen(
            player.x,
            player.y
        );

    player.angle = Math.atan2(
        mouse.y - playerScreen.y,
        mouse.x - playerScreen.x
    );
}


// ============================================================
// CAMERA UPDATE
// ============================================================

function updateCamera() {

    camera.x =
        player.x -
        screenWidth / 2;

    camera.y =
        player.y -
        screenHeight / 2;

    camera.x = Math.max(
        0,
        Math.min(
            WORLD.width - screenWidth,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            WORLD.height - screenHeight,
            camera.y
        )
    );
}


// ============================================================
// DRAW ISLAND
// ============================================================

function drawIsland() {

    // Outer background
    ctx.fillStyle = "#28633a";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    // Island
    const island =
        worldToScreen(
            0,
            0
        );

    ctx.fillStyle = "#4e9b4d";

    ctx.fillRect(
        island.x,
        island.y,
        WORLD.width,
        WORLD.height
    );
}


// ============================================================
// DRAW WATER
// ============================================================

function drawWater() {

    for (const water of waterAreas) {

        const position =
            worldToScreen(
                water.x,
                water.y
            );

        ctx.fillStyle = "#4b9fc8";

        ctx.fillRect(
            position.x,
            position.y,
            water.width,
            water.height
        );

        // Water lines
        ctx.strokeStyle =
            "rgba(255,255,255,0.14)";

        ctx.lineWidth = 3;

        for (
            let y = water.y + 25;
            y < water.y + water.height;
            y += 35
        ) {

            const start =
                worldToScreen(
                    water.x,
                    y
                );

            const end =
                worldToScreen(
                    water.x + water.width,
                    y
                );

            ctx.beginPath();

            ctx.moveTo(
                start.x,
                start.y
            );

            ctx.lineTo(
                end.x,
                end.y
            );

            ctx.stroke();
        }
    }
}


// ============================================================
// DRAW ROADS
// ============================================================

function drawRoads() {

    for (const road of roads) {

        const start =
            worldToScreen(
                road.x1,
                road.y1
            );

        const end =
            worldToScreen(
                road.x2,
                road.y2
            );

        ctx.beginPath();

        ctx.moveTo(
            start.x,
            start.y
        );

        ctx.lineTo(
            end.x,
            end.y
        );

        ctx.strokeStyle = "#94734e";
        ctx.lineWidth = road.width;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            start.x,
            start.y
        );

        ctx.lineTo(
            end.x,
            end.y
        );

        ctx.strokeStyle = "#c6a774";
        ctx.lineWidth =
            road.width * 0.72;

        ctx.stroke();
    }
}


// ============================================================
// DRAW BUILDINGS
// ============================================================

function drawBuildings() {

    for (const building of buildings) {

        const position =
            worldToScreen(
                building.x,
                building.y
            );

        let wallColor = "#d8c7a4";
        let roofColor = "#a84f42";

        if (building.type === "shop") {
            wallColor = "#e4d5b8";
            roofColor = "#3d718c";
        }

        if (building.type === "warehouse") {
            wallColor = "#8c9699";
            roofColor = "#50595c";
        }

        if (building.type === "industrial") {
            wallColor = "#777f82";
            roofColor = "#41484b";
        }

        if (building.type === "cabin") {
            wallColor = "#9b704e";
            roofColor = "#5d3d2b";
        }

        if (building.type === "farmhouse") {
            wallColor = "#e1d2aa";
            roofColor = "#9b493b";
        }

        if (building.type === "barn") {
            wallColor = "#a94d3f";
            roofColor = "#74342e";
        }

        if (building.type === "research") {
            wallColor = "#c9d5d9";
            roofColor = "#526c78";
        }

        // Shadow
        ctx.fillStyle =
            "rgba(0,0,0,0.22)";

        ctx.fillRect(
            position.x + 12,
            position.y + 12,
            building.width,
            building.height
        );

        // Building
        ctx.fillStyle = wallColor;

        ctx.fillRect(
            position.x,
            position.y,
            building.width,
            building.height
        );

        // Roof
        ctx.fillStyle = roofColor;

        ctx.fillRect(
            position.x,
            position.y,
            building.width,
            Math.min(
                30,
                building.height * 0.2
            )
        );

        // Outline
        ctx.strokeStyle =
            "rgba(25,30,30,0.5)";

        ctx.lineWidth = 5;

        ctx.strokeRect(
            position.x,
            position.y,
            building.width,
            building.height
        );

        // Windows
        const windowSize = 18;
        const windowGap = 42;

        ctx.fillStyle = "#8fd3e8";

        for (
            let offset = 25;
            offset <
            building.width - 20;
            offset += windowGap
        ) {

            ctx.fillRect(
                position.x + offset,
                position.y +
                    building.height * 0.45,
                windowSize,
                14
            );
        }

        // Door
        ctx.fillStyle = "#5b4638";

        ctx.fillRect(
            position.x +
                building.width / 2 -
                10,
            position.y +
                building.height -
                35,
            20,
            35
        );
    }
}


// ============================================================
// DRAW TREES
// ============================================================

function drawTrees() {

    for (const tree of trees) {

        const position =
            worldToScreen(
                tree.x,
                tree.y
            );

        // Skip objects far outside screen
        if (
            position.x < -50 ||
            position.x > screenWidth + 50 ||
            position.y < -50 ||
            position.y > screenHeight + 50
        ) {
            continue;
        }

        // Shadow
        ctx.fillStyle =
            "rgba(0,0,0,0.18)";

        ctx.beginPath();

        ctx.ellipse(
            position.x + 5,
            position.y + 8,
            tree.radius,
            tree.radius * 0.65,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        // Trunk
        ctx.fillStyle = "#6d4b32";

        ctx.fillRect(
            position.x - 4,
            position.y,
            8,
            14
        );

        // Crown
        ctx.fillStyle = "#2f743d";

        ctx.beginPath();

        ctx.arc(
            position.x,
            position.y - 3,
            tree.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#3f8a48";

        ctx.beginPath();

        ctx.arc(
            position.x - 5,
            position.y - 7,
            tree.radius * 0.65,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ============================================================
// DRAW ROCKS
// ============================================================

function drawRocks() {

    for (const rock of rocks) {

        const position =
            worldToScreen(
                rock.x,
                rock.y
            );

        if (
            position.x < -40 ||
            position.x > screenWidth + 40 ||
            position.y < -40 ||
            position.y > screenHeight + 40
        ) {
            continue;
        }

        ctx.fillStyle =
            "rgba(0,0,0,0.15)";

        ctx.beginPath();

        ctx.ellipse(
            position.x + 3,
            position.y + 4,
            rock.radius,
            rock.radius * 0.65,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#777d75";

        ctx.beginPath();

        ctx.arc(
            position.x,
            position.y,
            rock.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ============================================================
// DRAW LOCATION LABELS
// ============================================================

function drawLocations() {

    for (const location of locations) {

        const center =
            worldToScreen(
                location.x +
                    location.width / 2,
                location.y +
                    location.height / 2
            );

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font =
            "900 28px Arial";

        ctx.fillStyle =
            "rgba(255,255,255,0.82)";

        ctx.fillText(
            location.name.toUpperCase(),
            center.x,
            center.y
        );
    }
}


// ============================================================
// DRAW PLAYER
// ============================================================

function drawPlayer() {

    const position =
        worldToScreen(
            player.x,
            player.y
        );

    // Shadow
    ctx.fillStyle =
        "rgba(0,0,0,0.25)";

    ctx.beginPath();

    ctx.ellipse(
        position.x,
        position.y + 8,
        player.radius,
        player.radius * 0.65,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Body
    ctx.fillStyle = "#e9f5ff";

    ctx.beginPath();

    ctx.arc(
        position.x,
        position.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Outline
    ctx.strokeStyle = "#19344a";
    ctx.lineWidth = 4;

    ctx.stroke();

    // Direction
    ctx.strokeStyle = "#19344a";
    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        position.x,
        position.y
    );

    ctx.lineTo(
        position.x +
            Math.cos(player.angle) *
            28,
        position.y +
            Math.sin(player.angle) *
            28
    );

    ctx.stroke();

    // Health bar
    const barWidth = 52;
    const barHeight = 7;

    ctx.fillStyle =
        "rgba(0,0,0,0.45)";

    ctx.fillRect(
        position.x -
            barWidth / 2,
        position.y -
            player.radius -
            17,
        barWidth,
        barHeight
    );

    ctx.fillStyle = "#65d66f";

    ctx.fillRect(
        position.x -
            barWidth / 2,
        position.y -
            player.radius -
            17,
        barWidth *
            (player.health /
                player.maxHealth),
        barHeight
    );
}


// ============================================================
// MINIMAP
// ============================================================

function drawMinimap() {

    const size = 190;
    const padding = 20;

    const x =
        screenWidth -
        size -
        padding;

    const y = padding;

    ctx.fillStyle =
        "rgba(10,20,15,0.78)";

    ctx.fillRect(
        x,
        y,
        size,
        size
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.4)";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        size,
        size
    );

    // Island
    ctx.fillStyle = "#4e9b4d";

    ctx.fillRect(
        x + 8,
        y + 8,
        size - 16,
        size - 16
    );

    // River
    for (const water of waterAreas) {

        ctx.fillStyle = "#4b9fc8";

        ctx.fillRect(
            x +
                (water.x /
                    WORLD.width) *
                    size,
            y +
                (water.y /
                    WORLD.height) *
                    size,
            (water.width /
                WORLD.width) *
                size,
            (water.height /
                WORLD.height) *
                size
        );
    }

    // Locations
    for (const location of locations) {

        ctx.fillStyle =
            "rgba(255,255,255,0.12)";

        ctx.fillRect(
            x +
                (location.x /
                    WORLD.width) *
                    size,
            y +
                (location.y /
                    WORLD.height) *
                    size,
            (location.width /
                WORLD.width) *
                size,
            (location.height /
                WORLD.height) *
                size
        );
    }

    // Player
    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        x +
            (player.x /
                WORLD.width) *
                size,
        y +
            (player.y /
                WORLD.height) *
                size,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// ============================================================
// HUD
// ============================================================

function drawHUD() {

    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    // Game title
    ctx.font =
        "900 22px Arial";

    ctx.fillStyle =
        "rgba(255,255,255,0.9)";

    ctx.fillText(
        "LAST CIRCLE",
        20,
        20
    );

    // Controls
    ctx.font =
        "14px Arial";

    ctx.fillStyle =
        "rgba(255,255,255,0.72)";

    ctx.fillText(
        "WASD / ARROWS — MOVE",
        20,
        50
    );

    // Health panel
    const panelX = 20;
    const panelY =
        screenHeight - 70;

    ctx.fillStyle =
        "rgba(10,20,15,0.75)";

    ctx.fillRect(
        panelX,
        panelY,
        250,
        48
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 15px Arial";

    ctx.fillText(
        "HEALTH",
        panelX + 12,
        panelY + 8
    );

    ctx.fillStyle =
        "rgba(255,255,255,0.2)";

    ctx.fillRect(
        panelX + 75,
        panelY + 10,
        155,
        14
    );

    ctx.fillStyle = "#65d66f";

    ctx.fillRect(
        panelX + 75,
        panelY + 10,
        155 *
            (player.health /
                player.maxHealth),
        14
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 13px Arial";

    ctx.fillText(
        `${Math.ceil(player.health)} / ${player.maxHealth}`,
        panelX + 75,
        panelY + 30
    );
}


// ============================================================
// RENDER
// ============================================================

function render() {

    ctx.clearRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    drawIsland();

    // World rendering order
    drawWater();
    drawRoads();
    drawLocations();
    drawTrees();
    drawRocks();
    drawBuildings();

    drawPlayer();

    // Screen-space UI
    drawMinimap();
    drawHUD();
}


// ============================================================
// GAME LOOP
// ============================================================

let lastTime = performance.now();

function gameLoop(currentTime) {

    let deltaTime =
        (currentTime - lastTime) /
        1000;

    lastTime = currentTime;

    // Prevent huge physics jumps
    deltaTime =
        Math.min(deltaTime, 0.05);

    updatePlayer(deltaTime);
    updateCamera();

    render();

    requestAnimationFrame(gameLoop);
}


// ============================================================
// START
// ============================================================

setTimeout(() => {

    document.getElementById(
        "loading"
    ).style.display = "none";

    updateCamera();

    requestAnimationFrame(
        gameLoop
    );

}, 600);

</script>

</body>
</html>
