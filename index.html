let screenWidth = window.innerWidth;
let screenHeight = window.innerHeight;
let deviceScale = 1;

function resizeCanvas() {
  screenWidth = Math.max(1, window.innerWidth);
  screenHeight = Math.max(1, window.innerHeight);

  deviceScale = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(screenWidth * deviceScale);
  canvas.height = Math.floor(screenHeight * deviceScale);

  canvas.style.width = screenWidth + "px";
  canvas.style.height = screenHeight + "px";

  ctx.setTransform(
    deviceScale,
    0,
    0,
    deviceScale,
    0,
    0
  );
}

window.addEventListener("resize", resizeCanvas);

const mouse = {
  x: screenWidth / 2,
  y: screenHeight / 2,
  down: false
};

function normalizeKey(key) {
  return String(key).toLowerCase();
}

const controlledKeys = new Set([
  "w",
  "a",
  "s",
  "d",
  "arrowup",
  "arrowdown",
  "arrowleft",
  "arrowright",
  "r",
  "e",
  "m",
  "tab",
  "escape",
  "1",
  "2",
  "3",
  "4",
  "5",
  " "
]);

function keyDown(event) {
  const key = normalizeKey(event.key);

  keys.add(key);

  if (controlledKeys.has(key)) {
    event.preventDefault();
  }
}

function keyUp(event) {
  const key = normalizeKey(event.key);

  keys.delete(key);
}

window.addEventListener(
  "keydown",
  keyDown,
  { passive: false }
);

window.addEventListener(
  "keyup",
  keyUp,
  { passive: true }
);

window.addEventListener("blur", () => {
  keys.clear();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    keys.clear();
    mouse.down = false;
  }
});


/* =========================================================
   MOUSE
========================================================= */

  const rect = canvas.getBoundingClientRect();

  mouse.x = event.clientX - rect.left;
  mouse.y = event.clientY - rect.top;
});

canvas.addEventListener("mousedown", event => {
  if (event.button === 0) {
    mouse.down = true;
  }

  canvas.focus();
});

window.addEventListener("mouseup", event => {
  if (event.button === 0) {

});

/* =========================================================
   RANDOM WORLD GENERATION
========================================================= */

function seededRandom(seed) {
  let value = seed >>> 0;

  return function() {
    value =
      (value * 1664525 + 1013904223)
      >>> 0;

    return value / 4294967296;
  };
}

const random = seededRandom(823741);


function isInsideBuilding(
  x,
  y,
  padding = 0
) {
  for (const building of buildings) {

    if (
      x > building.x - padding &&
      x <
        building.x +
        building.width +
        padding &&

      y > building.y - padding &&
      y <
        building.y +
        building.height +
        padding
    ) {
      return true;
    }
  }

  return false;
}


function isInsideWater(x, y) {

  for (const water of waterAreas) {

    if (
      x >= water.x &&
      x <= water.x + water.width &&

      y >= water.y &&
      y <= water.y + water.height
    ) {
      return true;
    }
  }

  return false;
}


function isOnRoad(x, y) {

  for (const road of roads) {

    if (
      x >= road.x - 10 &&
      x <= road.x + road.w + 10 &&

      y >= road.y - 10 &&
      y <= road.y + road.h + 10
    ) {
      return true;
    }
  }

  return false;
}

/* =========================================================
   WORLD / SCREEN COORDINATES
========================================================= */

function worldToScreen(x, y) {

  return {
    x:
      x -
      camera.x +
      screenWidth / 2,

    y:
      y -
      camera.y +
      screenHeight / 2
  };
}


function screenToWorld(x, y) {

  return {
    x:
      x +
      camera.x -
      screenWidth / 2,

    y:
      y +
      camera.y -
      screenHeight / 2
  };
}


/* =========================================================
   COLLISION
========================================================= */

function circleIntersectsRect(
  cx,
  cy,
  radius,
  rect
) {

  const nearestX = Math.max(
    rect.x,
    Math.min(
      cx,
      rect.x + rect.width
    )
  );

  const nearestY = Math.max(
    rect.y,
    Math.min(
      cy,
      rect.y + rect.height
    )
  );

  const dx = cx - nearestX;
  const dy = cy - nearestY;

  return (
    dx * dx +
    dy * dy <
    radius * radius
  );
}


function collidesWithBuilding(
  x,
  y,
  radius
) {

  for (const building of buildings) {

    if (
      circleIntersectsRect(
        x,
        y,
        radius,
        building
      )
    ) {
      return true;
    }
  }

  return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

function getMovementInput() {

  let dx = 0;
  let dy = 0;

  if (
    keys.has("w") ||
    keys.has("arrowup")
  ) {
    dy -= 1;
  }

  if (
    keys.has("s") ||
    keys.has("arrowdown")
  ) {
    dy += 1;
  }

  if (
    keys.has("a") ||
    keys.has("arrowleft")
  ) {
    dx -= 1;
  }

  if (
    keys.has("d") ||
    keys.has("arrowright")
  ) {
    dx += 1;
  }

  const length =
    Math.hypot(dx, dy);

  if (length > 0) {

    dx /= length;
    dy /= length;
  }

  return {
    dx,
    dy
  };
}


function movePlayer(deltaTime) {

  const movement =
    getMovementInput();

  if (
    movement.dx === 0 &&
    movement.dy === 0
  ) {
    return;
  }

  const distance =
    player.speed *
    deltaTime;

  const nextX =
    player.x +
    movement.dx *
    distance;

  const nextY =
    player.y +
    movement.dy *
    distance;

  const safeX =
    Math.max(
      player.radius,
      Math.min(
        WORLD.width -
          player.radius,
        nextX
      )
    );

  const safeY =
    Math.max(
      player.radius,
      Math.min(
        WORLD.height -
          player.radius,
        nextY
      )
    );

  /*
    X movement first.
    This allows sliding along walls.
  */

  if (
    !collidesWithBuilding(
      safeX,
      player.y,
      player.radius
    )
  ) {
    player.x = safeX;
  }

  /*
    Y movement second.
  */

  if (
    !collidesWithBuilding(
      player.x,
      safeY,
      player.radius
    )
  ) {
    player.y = safeY;
  }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

  const halfW =
    screenWidth / 2;

  const halfH =
    screenHeight / 2;

  camera.x =
    Math.max(
      halfW,
      Math.min(
        WORLD.width - halfW,
        player.x
      )
    );

  camera.y =
    Math.max(
      halfH,
      Math.min(
        WORLD.height - halfH,
        player.y
      )
    );

  if (
    WORLD.width <
    screenWidth
  ) {
    camera.x =
      WORLD.width / 2;
  }

  if (
    WORLD.height <
    screenHeight
  ) {
    camera.y =
      WORLD.height / 2;
  }
}


/* =========================================================
   DRAW HELPERS
========================================================= */

function roundedRect(
  context,
  x,
  y,
  width,
  height,
  radius
) {

  const r =
    Math.min(
      radius,
      width / 2,
      height / 2
    );

  context.beginPath();

  context.moveTo(
    x + r,
    y
  );

  context.arcTo(
    x + width,
    y,
    x + width,
    y + height,
    r
  );

  context.arcTo(
    x + width,
    y + height,
    x,
    y + height,
    r
  );

  context.arcTo(
    x,
    y + height,
    x,
    y,
    r
  );

  context.arcTo(
    x,
    y,
    x + width,
    y,
    r
  );

  context.closePath();
}


/* =========================================================
   ISLAND
========================================================= */

function drawIsland() {

  ctx.fillStyle = "#74aa62";

  ctx.fillRect(
    0,
    0,
    screenWidth,
    screenHeight
  );

  const tile = 180;

  const startX =
    Math.floor(
      (
        camera.x -
        screenWidth / 2
      ) / tile
    ) * tile;

  const startY =
    Math.floor(
      (
        camera.y -
        screenHeight / 2
      ) / tile
    ) * tile;

  for (
    let wx = startX;
    wx <
      camera.x +
      screenWidth / 2 +
      tile;
    wx += tile
  ) {

    for (
      let wy = startY;
      wy <
        camera.y +
        screenHeight / 2 +
        tile;
      wy += tile
    ) {

      const p =
        worldToScreen(
          wx,
          wy
        );

      const checker =
        (
          Math.floor(wx / tile) +
          Math.floor(wy / tile)
        ) % 2;

      ctx.fillStyle =
        checker === 0
          ? "rgba(255,255,255,0.018)"
          : "rgba(0,0,0,0.014)";

      ctx.fillRect(
        p.x,
        p.y,
        tile,
        tile
      );
    }
  }
}


/* =========================================================
   WATER
========================================================= */

function drawWater() {

  for (const water of waterAreas) {

    const p =
      worldToScreen(
        water.x,
        water.y
      );

    ctx.fillStyle = "#48a8d8";

    ctx.fillRect(
      p.x,
      p.y,
      water.width,
      water.height
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.15)";

    for (
      let y = water.y + 20;
      y < water.y + water.height;
      y += 34
    ) {

      const screenY =
        y -
        camera.y +
        screenHeight / 2;

      const wave =
        Math.sin(
          (
            y +
            performance.now() * 0.02
          ) * 0.04
        ) * 18;

      ctx.fillRect(
        -10 + wave,
        screenY,
        screenWidth + 20,
        2
      );
    }
  }
}


/* =========================================================
   ROADS
========================================================= */

function drawRoads() {

  for (const road of roads) {

    const p =
      worldToScreen(
        road.x,
        road.y
      );

    ctx.fillStyle = "#b89d72";

    ctx.fillRect(
      p.x,
      p.y,
      road.w,
      road.h
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.12)";

    if (road.w > road.h) {

      ctx.fillRect(
        p.x,
        p.y + road.h * 0.47,
        road.w,
        4
      );

    } else {

      ctx.fillRect(
        p.x + road.w * 0.47,
        p.y,
        4,
        road.h
      );
    }
  }
}


/* =========================================================
   BUILDINGS
========================================================= */

function getBuildingColor(type) {

  switch (type) {

    case "shop":
      return "#e5b75d";

    case "warehouse":
      return "#89939a";

    case "industrial":
      return "#707b83";

    case "cabin":
      return "#9a6d4e";

    case "farmhouse":
      return "#d9d1b6";

    case "barn":
      return "#b74b43";

    case "research":
      return "#bac9d2";

    default:
      return "#d2b89a";
  }
}


function drawBuildings() {

  for (const building of buildings) {

    const p =
      worldToScreen(
        building.x,
        building.y
      );

    /* Shadow */

    ctx.fillStyle =
      "rgba(0,0,0,0.18)";

    ctx.fillRect(
      p.x + 8,
      p.y + 9,
      building.width,
      building.height
    );


    /* Building */

    ctx.fillStyle =
      getBuildingColor(
        building.type
      );

    ctx.fillRect(
      p.x,
      p.y,
      building.width,
      building.height
    );


    /* Roof highlight */

    ctx.fillStyle =
      "rgba(255,255,255,0.16)";

    ctx.fillRect(
      p.x + 6,
      p.y + 6,
      Math.max(
        0,
        building.width - 12
      ),
      8
    );


    /* Windows */

    const windowSize = 20;
    const gap = 32;

    ctx.fillStyle = "#7fc5dd";

    for (
      let x =
        p.x + 22;

      x <
        p.x +
        building.width -
        15;

      x += gap
    ) {

      if (
        x + windowSize <=
        p.x +
        building.width -
        10
      ) {

        ctx.fillRect(
          x,
          p.y +
            building.height *
            0.28,
          windowSize,
          15
        );
      }
    }


    /* Door */

    ctx.fillStyle = "#5f4034";

    ctx.fillRect(
      p.x +
        building.width / 2 -
        14,

      p.y +
        building.height -
        40,

      28,
      40
    );
  }
}


/* =========================================================
   TREES
========================================================= */

function drawTrees() {

  for (const tree of trees) {

    const p =
      worldToScreen(
        tree.x,
        tree.y
      );

    if (
      p.x < -40 ||
      p.x >
        screenWidth + 40 ||
      p.y < -40 ||
      p.y >
        screenHeight + 40
    ) {
      continue;
    }


    /* trunk */

    ctx.fillStyle = "#74523d";

    ctx.fillRect(
      p.x - 3,
      p.y + 6,
      6,
      13
    );


    /* leaves */

    ctx.beginPath();

    ctx.fillStyle = "#2f7344";

    ctx.arc(
      p.x,
      p.y,
      tree.r,
      0,
      Math.PI * 2
    );

    ctx.fill();


    /* highlight */

    ctx.beginPath();

    ctx.fillStyle =
      "rgba(255,255,255,0.10)";

    ctx.arc(
      p.x -
        tree.r * 0.3,

      p.y -
        tree.r * 0.35,

      tree.r * 0.4,

      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


/* =========================================================
   ROCKS
========================================================= */

function drawRocks() {

  for (const rock of rocks) {

    const p =
      worldToScreen(
        rock.x,
        rock.y
      );

    if (
      p.x < -30 ||
      p.x >
        screenWidth + 30 ||
      p.y < -30 ||
      p.y >
        screenHeight + 30
    ) {
      continue;
    }


    ctx.beginPath();

    ctx.fillStyle = "#68716d";

    ctx.ellipse(
      p.x,
      p.y,
      rock.r * 1.25,
      rock.r,
      -0.2,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.fillStyle =
      "rgba(255,255,255,0.14)";

    ctx.ellipse(
      p.x -
        rock.r * 0.25,

      p.y -
        rock.r * 0.2,

      rock.r * 0.45,
      rock.r * 0.3,
      -0.2,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


/* =========================================================
   PROPS
========================================================= */

function drawProps() {

  for (const prop of props) {

    const p =
      worldToScreen(
        prop.x,
        prop.y
      );

    if (
      p.x < -40 ||
      p.x >
        screenWidth + 40 ||
      p.y < -40 ||
      p.y >
        screenHeight + 40
    ) {
      continue;
    }


    if (prop.type === "crate") {

      ctx.fillStyle = "#9b6a3e";

      ctx.fillRect(
        p.x - 9,
        p.y - 9,
        18,
        18
      );

      ctx.strokeStyle =
        "rgba(255,255,255,0.15)";

      ctx.strokeRect(
        p.x - 9,
        p.y - 9,
        18,
        18
      );
    }


    else if (
      prop.type === "fence"
    ) {

      ctx.strokeStyle = "#8a7256";
      ctx.lineWidth = 4;

      ctx.beginPath();

      ctx.moveTo(
        p.x - 12,
        p.y
      );

      ctx.lineTo(
        p.x + 12,
        p.y
      );

      ctx.moveTo(
        p.x - 8,
        p.y - 7
      );

      ctx.lineTo(
        p.x - 8,
        p.y + 7
      );

      ctx.moveTo(
        p.x + 8,
        p.y - 7
      );

      ctx.lineTo(
        p.x + 8,
        p.y + 7
      );

      ctx.stroke();
    }


    else {

      ctx.fillStyle = "#f2db67";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        3,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }
}


/* =========================================================
   LOCATION LABELS
========================================================= */

function drawLocationLabels() {

  ctx.textAlign = "center";
  ctx.font = "700 18px Arial";

  for (const location of locations) {

    const p =
      worldToScreen(
        location.x,
        location.y -
          location.radius -
          28
      );

    if (
      p.x < -150 ||
      p.x >
        screenWidth + 150 ||
      p.y < -60 ||
      p.y >
        screenHeight + 60
    ) {
      continue;
    }

    const width =
      ctx.measureText(
        location.name
      ).width + 28;

    roundedRect(
      ctx,
      p.x - width / 2,
      p.y - 16,
      width,
      32,
      10
    );

    ctx.fillStyle =
      "rgba(14,24,27,0.72)";

    ctx.fill();

    ctx.fillStyle = "#f4f6f4";

    ctx.fillText(
      location.name,
      p.x,
      p.y + 6
    );
  }
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer() {

  const p =
    worldToScreen(
      player.x,
      player.y
    );

  const aim =
    screenToWorld(
      mouse.x,
      mouse.y
    );

  player.angle =
    Math.atan2(
      aim.y - player.y,
      aim.x - player.x
    );


  /* Shadow */

  ctx.beginPath();

  ctx.fillStyle =
    "rgba(0,0,0,0.22)";

  ctx.ellipse(
    p.x,
    p.y + 8,
    20,
    9,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Body */

  ctx.beginPath();

  ctx.fillStyle =
    player.color;

  ctx.arc(
    p.x,
    p.y,
    player.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.lineWidth = 3;
  ctx.strokeStyle = "#17374b";

  ctx.stroke();


  /* Weapon */

  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );

  ctx.rotate(
    player.angle
  );

  ctx.fillStyle = "#26343b";

  ctx.fillRect(
    8,
    -4,
    25,
    8
  );

  ctx.restore();


  /* Health bar */

  const barWidth = 46;
  const healthRatio =
    Math.max(
      0,
      player.health /
        player.maxHealth
    );

  ctx.fillStyle =
    "rgba(0,0,0,0.45)";

  ctx.fillRect(
    p.x -
      barWidth / 2,
    p.y - 34,
    barWidth,
    6
  );

  ctx.fillStyle = "#65e184";

  ctx.fillRect(
    p.x -
      barWidth / 2,
    p.y - 34,
    barWidth *
      healthRatio,
    6
  );
}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap() {

  const size = 180;
  const padding = 18;

  const x =
    screenWidth -
    size -
    padding;

  const y =
    padding;


  roundedRect(
    ctx,
    x,
    y,
    size,
    size,
    14
  );

  ctx.fillStyle =
    "rgba(12,20,22,0.80)";

  ctx.fill();

  ctx.strokeStyle =
    "rgba(255,255,255,0.16)";

  ctx.lineWidth = 2;

  ctx.stroke();


  const scaleX =
    size / WORLD.width;

  const scaleY =
    size / WORLD.height;


  /* Water */

  for (const water of waterAreas) {

    ctx.fillStyle =
      "#378eb9";

    ctx.fillRect(
      x +
        water.x *
        scaleX,

      y +
        water.y *
        scaleY,

      water.width *
        scaleX,

      water.height *
        scaleY
    );
  }


  /* Roads */

  ctx.fillStyle =
    "rgba(213,189,143,0.7)";

  for (const road of roads) {

    ctx.fillRect(
      x +
        road.x *
        scaleX,

      y +
        road.y *
        scaleY,

      Math.max(
        1,
        road.w * scaleX
      ),

      Math.max(
        1,
        road.h * scaleY
      )
    );
  }


  /* Locations */

  for (const location of locations) {

    ctx.beginPath();

    ctx.fillStyle =
      "rgba(255,255,255,0.35)";

    ctx.arc(
      x +
        location.x *
        scaleX,

      y +
        location.y *
        scaleY,

      4,

      0,
      Math.PI * 2
    );

    ctx.fill();
  }


  /* Player */

  ctx.beginPath();

  ctx.fillStyle =
    "#66e0ff";

  ctx.arc(
    x +
      player.x *
      scaleX,

    y +
      player.y *
      scaleY,

    4,

    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle = "#ffffff";
  ctx.font = "700 11px Arial";
  ctx.textAlign = "left";

  ctx.fillText(
    "MAP",
    x + 9,
    y + 16
  );
}


/* =========================================================
   HUD
========================================================= */

function drawHUD() {

  /* Top-left */

  roundedRect(
    ctx,
    18,
    18,
    245,
    72,
    12
  );

  ctx.fillStyle =
    "rgba(10,18,20,0.72)";

  ctx.fill();


  ctx.fillStyle = "#ffffff";
  ctx.font = "800 20px Arial";
  ctx.textAlign = "left";

  ctx.fillText(
    "LAST CIRCLE",
    30,
    43
  );


  /* Health */

  ctx.fillStyle =
    "rgba(255,255,255,0.15)";

  ctx.fillRect(
    30,
    57,
    150,
    10
  );

  ctx.fillStyle = "#62e081";

  ctx.fillRect(
    30,
    57,
    150 *
      (
        player.health /
        player.maxHealth
      ),
    10
  );


  ctx.fillStyle = "#dce5e7";
  ctx.font = "600 13px Arial";

  ctx.fillText(
    "HP " +
      Math.ceil(player.health) +
      " / " +
      player.maxHealth,
    190,
    66
  );


  /* Controls */

  const controlWidth =
    Math.min(
      330,
      screenWidth - 36
    );

  roundedRect(
    ctx,
    18,
    screenHeight - 92,
    controlWidth,
    74,
    12
  );

  ctx.fillStyle =
    "rgba(10,18,20,0.72)";

  ctx.fill();


  ctx.fillStyle = "#ffffff";
  ctx.font = "600 13px Arial";

  ctx.fillText(
    "WASD / ARROWS  Move",
    30,
    screenHeight - 64
  );

  ctx.fillStyle = "#aebfc5";

  ctx.fillText(
    "Mouse  Aim     Left Click  Fire",
    30,
    screenHeight - 43
  );

  ctx.fillText(
    "R Reload     E Interact     M Map",
    30,
    screenHeight - 22
  );


  /* Crosshair */

  ctx.strokeStyle =
    "rgba(255,255,255,0.85)";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    mouse.x - 7,
    mouse.y
  );

  ctx.lineTo(
    mouse.x + 7,
    mouse.y
  );

  ctx.moveTo(
    mouse.x,
    mouse.y - 7
  );

  ctx.lineTo(
    mouse.x,
    mouse.y + 7
  );

  ctx.stroke();


  drawMinimap();
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  ctx.clearRect(
    0,
    0,
    screenWidth,
    screenHeight
  );

  drawIsland();

  drawWater();

  drawRoads();

  drawProps();

  drawTrees();

  drawRocks();

  drawBuildings();

  drawLocationLabels();

  drawPlayer();

  drawHUD();
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
  performance.now();

function gameLoop(now) {

  const deltaTime =
    Math.min(
      (now - lastTime) / 1000,
      0.05
    );

  lastTime = now;

  movePlayer(
    deltaTime
  );

  updateCamera();

  render();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   START
========================================================= */

updateCamera();

requestAnimationFrame(
  gameLoop
);

setTimeout(() => {

  loading.classList.add(
    "hidden"
  );

  canvas.focus();

}, 300);

</script>
</body>
</html>
